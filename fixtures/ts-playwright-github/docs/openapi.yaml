openapi: 3.0.3
info:
  title: Catalogue API
  version: 1.4.0
servers:
  - url: http://localhost:3000
paths:
  /api/catalogue:
    get:
      operationId: listCatalogue
      summary: List available products
      responses:
        '200':
          description: Catalogue items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
components:
  schemas:
    Product:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
          minimum: 0
