openapi: 3.0.3
info:
  title: Orders API
  version: 1.2.0
servers:
  - url: http://localhost:8080
paths:
  /orders:
    post:
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '201':
          description: Order created
        '400':
          description: Invalid order request
  /orders/{id}:
    get:
      summary: Retrieve an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order found
        '404':
          description: Order not found
components:
  schemas:
    NewOrder:
      type: object
      required: [customerId, sku, quantity]
      properties:
        customerId:
          type: string
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
