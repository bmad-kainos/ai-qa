trigger:
  branches:
    include:
      - main

stages:
  - stage: Test
    jobs:
      - job: MavenTests
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled
          - script: sh mvnw --batch-mode test
            displayName: Run JUnit and RestAssured tests
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/target/surefire-reports/TEST-*.xml'

  - stage: Deploy
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: OrdersStaging
        environment: orders-staging
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Deployment is performed by the approved environment release task."
                  displayName: Deployment hand-off
