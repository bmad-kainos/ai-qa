trigger:
  branches:
    include:
      - main
stages:
  - stage: Test
    jobs:
      - job: BillingTests
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: '8.0.x'
          - script: dotnet test Billing.sln --logger trx --results-directory $(Agent.TempDirectory)/TestResults
            displayName: Run xUnit tests
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
  - stage: Deploy
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: BillingStaging
        environment: billing-staging
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Deploy through the approved Billing release environment."
