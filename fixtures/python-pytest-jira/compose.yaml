services:
  stock-db:
    image: postgres:16
    environment:
      POSTGRES_DB: stock
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: ${STOCK_DB_PASSWORD:?Set STOCK_DB_PASSWORD for local integration tests}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock"]
      interval: 5s
      timeout: 3s
      retries: 10
