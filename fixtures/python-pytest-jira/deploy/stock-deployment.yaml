apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-api
  namespace: commerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stock-api
  template:
    metadata:
      labels:
        app: stock-api
    spec:
      containers:
        - name: api
          image: registry.example.org/commerce/stock-api:1.3.0
          ports:
            - containerPort: 8000
          env:
            - name: STOCK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stock-database
                  key: url