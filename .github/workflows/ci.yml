name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Require bash and pwsh so installer tests cannot skip silently
        run: |
          bash --version | head -1
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: Run tests
        run: python -m unittest discover -s tests -v
